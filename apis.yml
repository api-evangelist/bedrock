aid: bedrock
name: Bedrock
description: 'Bedrock (Bedrock Ocean Exploration) builds advanced autonomous underwater
  vehicles (AUVs) and Mosaic, a cloud-native data platform that transforms how the
  world maps, monitors, and understands the seafloor. Its AUV fleet carries multibeam
  echosounder, side-scan sonar, magnetometer, and sub-bottom profiler payloads to
  deliver high-resolution geophysical survey data for offshore energy (wind, oil and
  gas, renewables), ports and harbors, submarine telecom infrastructure, defense,
  and scientific research. A Northzone portfolio company, Bedrock is an enterprise
  ocean-data provider; it publishes no public developer API at this time.'
